[pytest]
# Les tests sont lancés depuis la racine : le dossier api/ doit être importable
pythonpath = .
testpaths = tests

# Avertissements connus et sans effet sur les résultats.
# Pytest réinitialise les filtres à chaque test : ils doivent donc être déclarés ici.
filterwarnings =
    # Avertissement interne à Starlette (dépendance de FastAPI)
    ignore::DeprecationWarning:starlette.*
    # Le pipeline transmet au LightGBM un tableau sans noms de colonnes ; l'ordre est garanti
    ignore:X does not have valid feature names:UserWarning
    # Changement futur de pandas dans la classe ConstructeurFeatures du Projet 6
    ignore:Downcasting behavior:FutureWarning
