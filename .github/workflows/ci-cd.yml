# Pipeline CI/CD de l'API de scoring crédit
# Déclenché à chaque push et à chaque pull request sur les branches main et develop
# La publication de l'image et le déploiement n'ont lieu que lors d'un push sur main
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Paramètres communs : nom de l'image (en minuscules) et ressources Azure
env:
  IMAGE_NAME: ghcr.io/ouse4444/oc_ds_p8
  RESOURCE_GROUP: rg-credit-scoring
  CONTAINER_APP: credit-scoring-api

jobs:
  # Job 1 : les tests automatisés, sur une machine neuve
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Le pipeline échoue si un test échoue ou si la couverture passe sous 90 %
      - name: Run tests with coverage
        run: python -m pytest --cov=api --cov-report=term-missing --cov-fail-under=90

  # Job 2 : construction de l'image Docker, seulement si les tests ont réussi
  build:
    name: Build and smoke test Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # load: true rend l'image disponible sur la machine, pour la tester juste après
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: credit-scoring-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test de fumée : le conteneur démarre-t-il, et le modèle est-il chargé ?
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 credit-scoring-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/health | grep -q '"model_loaded":true'; then
              echo "API is up and the model is loaded"
              docker stop api
              exit 0
            fi
            sleep 2
          done
          echo "API did not start in time"
          docker logs api
          exit 1

  # Job 3 : publication de l'image sur GHCR
  # Uniquement lors d'un push sur main, et uniquement si les jobs 1 et 2 ont réussi :
  # seule une version testée et validée peut partir en production
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Droit d'écrire dans le registre, limité à ce job (principe du moindre privilège)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN est un jeton temporaire fourni par GitHub à chaque exécution :
      # aucun mot de passe n'est stocké dans le dépôt
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deux étiquettes : "latest" pour la version courante, et l'identifiant du commit
      # pour savoir exactement quel code tourne en production et pouvoir revenir en arrière
      # Le cache GHA réutilise les couches construites au job 2 : la construction est rapide
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 4 : déploiement de la nouvelle image sur Azure Container Apps
  # Uniquement lors d'un push sur main, et uniquement si l'image a bien été publiée
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Connexion avec le compte de service, dont les droits sont limités au groupe
      # rg-credit-scoring. Les identifiants viennent d'un secret chiffré de GitHub
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # L'image est désignée par l'identifiant du commit, et non par "latest" :
      # une nouvelle étiquette oblige Azure à créer une nouvelle révision, traçable,
      # à laquelle on peut revenir en cas de problème
      - name: Deploy new image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_NAME:${{ github.sha }}"

      # Vérification en production : la nouvelle révision doit être prête, puis
      # l'adresse publique doit répondre avec le modèle chargé
      - name: Check the deployed API
        run: |
          for i in $(seq 1 30); do
            LATEST=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
            READY=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.latestReadyRevisionName -o tsv)
            if [ "$LATEST" = "$READY" ]; then break; fi
            echo "Waiting for revision $LATEST to be ready..."
            sleep 10
          done
          URL=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fs --max-time 30 "https://$URL/health" | grep -q '"model_loaded":true'; then
              echo "Deployed API is up and the model is loaded: https://$URL"
              exit 0
            fi
            sleep 10
          done
          echo "Deployed API did not respond in time"
          exit 1