# Pipeline CI/CD de l'API de scoring crédit et de son interface de test
# Déclenché à chaque push et à chaque pull request sur les branches main et develop
# La publication des images et le déploiement n'ont lieu que lors d'un push sur main
#
# Deux services séparés :
# - l'API (service de prédiction autonome, utilisable par tout client)
# - l'interface Gradio (un client de l'API, qui l'appelle par HTTP)
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Paramètres communs. Les deux images sont rangées dans le même paquet GHCR, déjà public :
# l'API sous les étiquettes latest et <commit>, l'interface sous ui-latest et ui-<commit>
env:
  IMAGE_NAME: ghcr.io/ouse4444/oc_ds_p8
  RESOURCE_GROUP: rg-credit-scoring
  ENVIRONMENT: env-credit-scoring
  CONTAINER_APP: credit-scoring-api
  CONTAINER_APP_UI: credit-scoring-ui

jobs:
  # Job 1 : les tests automatisés de l'API et de l'interface, sur une machine neuve
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            ui/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Le pipeline échoue si un test échoue ou si la couverture passe sous 90 %
      - name: Run tests with coverage
        run: python -m pytest --cov=api --cov=ui --cov-report=term-missing --cov-fail-under=90

  # Job 2 : construction de l'image de l'API, seulement si les tests ont réussi
  build:
    name: Build and smoke test API image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # load: true rend l'image disponible sur la machine, pour la tester juste après
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: credit-scoring-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test de fumée : le conteneur démarre-t-il, et le modèle est-il chargé ?
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 credit-scoring-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/health | grep -q '"model_loaded":true'; then
              echo "API is up and the model is loaded"
              docker stop api
              exit 0
            fi
            sleep 2
          done
          echo "API did not start in time"
          docker logs api
          exit 1

  # Job 3 : construction de l'image de l'interface, en parallèle du job 2
  build-ui:
    name: Build and smoke test UI image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Le contexte est le dossier ui/ : l'image ne contient que l'interface
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ui
          load: true
          tags: credit-scoring-ui:ci
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      # Test de fumée : l'interface démarre même si l'API est injoignable.
      # C'est la preuve que les deux services sont indépendants.
      - name: Smoke test the container
        run: |
          docker run -d --name ui -p 7860:7860 -e API_URL=http://127.0.0.1:9 credit-scoring-ui:ci
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://127.0.0.1:7860/; then
              echo "UI is up"
              docker stop ui
              exit 0
            fi
            sleep 2
          done
          echo "UI did not start in time"
          docker logs ui
          exit 1

  # Job 4 : publication des deux images sur GHCR
  # Uniquement lors d'un push sur main, et uniquement si les jobs précédents ont réussi
  publish:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    needs: [build, build-ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Droit d'écrire dans le registre, limité à ce job (principe du moindre privilège)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN est un jeton temporaire fourni par GitHub à chaque exécution
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Étiquette du commit : savoir exactement quel code tourne, et pouvoir revenir en arrière
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:ui-latest
            ${{ env.IMAGE_NAME }}:ui-${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

  # Job 5 : déploiement des deux services sur Azure Container Apps
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Connexion avec le compte de service, limité au groupe rg-credit-scoring
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_NAME:${{ github.sha }}"

      # Vérification en production : la nouvelle révision doit être prête, puis
      # l'adresse publique doit répondre avec le modèle chargé
      - name: Check the deployed API
        run: |
          for i in $(seq 1 30); do
            LATEST=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
            READY=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.latestReadyRevisionName -o tsv)
            if [ "$LATEST" = "$READY" ]; then break; fi
            echo "Waiting for revision $LATEST to be ready..."
            sleep 10
          done
          URL=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fs --max-time 30 "https://$URL/health" | grep -q '"model_loaded":true'; then
              echo "Deployed API is up and the model is loaded: https://$URL"
              exit 0
            fi
            sleep 10
          done
          echo "Deployed API did not respond in time"
          exit 1

      # L'interface reçoit l'adresse publique de l'API par la variable API_URL.
      # Au premier déploiement, l'application n'existe pas encore : elle est créée.
      - name: Deploy UI image
        run: |
          API_FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          if az containerapp show -n "$CONTAINER_APP_UI" -g "$RESOURCE_GROUP" > /dev/null 2>&1; then
            az containerapp update \
              --name "$CONTAINER_APP_UI" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE_NAME:ui-${{ github.sha }}" \
              --set-env-vars "API_URL=https://$API_FQDN"
          else
            az containerapp create \
              --name "$CONTAINER_APP_UI" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ENVIRONMENT" \
              --image "$IMAGE_NAME:ui-${{ github.sha }}" \
              --target-port 7860 --ingress external \
              --cpu 0.5 --memory 1.0Gi \
              --min-replicas 0 --max-replicas 1 \
              --env-vars "API_URL=https://$API_FQDN"
          fi

      - name: Check the deployed UI
        run: |
          URL=$(az containerapp show -n "$CONTAINER_APP_UI" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null --max-time 30 "https://$URL/"; then
              echo "Deployed UI is up: https://$URL"
              exit 0
            fi
            sleep 10
          done
          echo "Deployed UI did not respond in time"
          exit 1
